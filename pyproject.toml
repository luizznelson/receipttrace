[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "receipttrace"
version = "0.1.0"
description = "Traceable receipt extraction and evaluation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyarrow>=23,<24",
    "pillow>=12,<13",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "mypy>=1.19,<2"]

[project.scripts]
receipttrace = "receipttrace.cli:main"

[project.optional-dependencies]
ocr = [
    "onnxruntime>=1.24,<2",
    "rapidocr>=3.10,<4",
]
llm = [
    "openai>=2,<3",
]
gemini = [
    "httpx>=0.28,<1",
]

web = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.38,<1",
    "httpx>=0.28,<1",
    "httpx2>=2.16.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "rapidocr", "rapidocr.*", "openai", "openai.*", "httpx", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
