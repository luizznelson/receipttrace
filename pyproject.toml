[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "receipttrace"
version = "0.1.0"
description = "Traceable receipt extraction and evaluation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["pyarrow>=23,<24", "pillow>=12,<13", "pydantic>=2.12,<3"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "mypy>=1.19,<2"]

[project.scripts]
receipttrace = "receipttrace.cli:main"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
